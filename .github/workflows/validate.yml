name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coding-tooling-fast:
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@a547cfd83a7dcdece2ca54786114159c5e6c9d40
    permissions:
      contents: read
    with:
      operation: run
      tier: fast
      component: "geo-analysis"
      report_path: .artifacts/coding-tooling/fast.json

  performance-smoke:
    needs: coding-tooling-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install Callgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install Iai-Callgrind runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Run deterministic performance smoke
        env:
          PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash scripts/benchmark-smoke.sh
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-smoke-${{ github.sha }}
          path: .artifacts/performance-smoke/
          if-no-files-found: warn
