name: Resolve geo-grid lockfile

on:
  push:
    branches:
      - feature/geojson-discrete-grids
    paths:
      - Cargo.toml
      - crates/moenarch-geo-grid/Cargo.toml
      - .github/workflows/resolve-geo-grid-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feature/geojson-discrete-grids
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Resolve lockfile
        run: cargo generate-lockfile
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: resolve geo-grid dependencies"
          git push origin HEAD:feature/geojson-discrete-grids
